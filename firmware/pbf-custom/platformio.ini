; Panda Bamboo Feeder — custom firmware (buffer / load-assist only, no 5-way hub)
; Pin assignments: src/config.h

[env:pbf_custom]
platform = espressif32 @ 7.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_stock.csv

upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200

build_flags =
    -DPBF_FW_VERSION=\"0.10.0\"
; keeps the builder's home directory (user name) out of firmware.bin
extra_scripts = pre:strip_paths.py

lib_deps =
    olikraus/U8g2 @ ^2.35.19
    teemuatlut/TMCStepper @ ^0.7.3
    bblanchon/ArduinoJson @ ^7.2.0

; Network upload (ArduinoOTA). Use the feeder's IP if pbf.local does not resolve on Windows:
;   pio run -e pbf_custom_ota -t upload --upload-port 192.168.x.x
[env:pbf_custom_ota]
extends = env:pbf_custom
upload_protocol = espota
upload_port = pbf.local
